name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never writes to the repo.
permissions:
  contents: read

# One run per branch/PR — superseded pushes cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + latency bench (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test suite (104 tests)
        run: npm test

      - name: Latency benchmark (fails CI on drift)
        run: npm run bench
